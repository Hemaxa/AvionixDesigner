name: macOS Release
run-name: macOS release from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS installer
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read CMake version
        id: version
        shell: pwsh
        run: |
          $cmake = Get-Content -Path CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\s*\(\s*AvionixDesigner\s+VERSION\s+([0-9]+(?:\.[0-9]+){1,3})') {
            throw "Could not find project(AvionixDesigner VERSION x.y.z ...) in CMakeLists.txt"
          }
          $version = $Matches[1]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package installer
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Locate installer
        id: package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path build -Filter "AvionixDesigner-*-macos.dmg" -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "macOS installer was not produced by CPack"
          }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvionixDesigner-${{ steps.version.outputs.version }}-macos
          path: ${{ steps.package.outputs.installer }}

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: ${{ steps.package.outputs.installer }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags

          $tagExists = $false
          git rev-parse -q --verify "refs/tags/$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagExists = $true
          }

          if (-not $tagExists) {
            git tag $env:RELEASE_TAG $env:GITHUB_SHA
            git push origin $env:RELEASE_TAG
          }

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:INSTALLER --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:INSTALLER `
              --title "AvionixDesigner $env:RELEASE_VERSION" `
              --notes "macOS installer built from CMake project version $env:RELEASE_VERSION."
          }
