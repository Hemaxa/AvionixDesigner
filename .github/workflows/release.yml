name: Release Installers
run-name: Release installers from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read project version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read CMake version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^project\(AvionixDesigner VERSION ([0-9]+(\.[0-9]+){1,3}).*/\1/p' CMakeLists.txt | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not find project(AvionixDesigner VERSION x.y.z ...) in CMakeLists.txt" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows installer
    runs-on: windows-2022
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtsvg qtserialport
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package installer
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Locate installer
        id: package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path build -Filter "AvionixDesigner-*-windows-x64.exe" -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced by CPack"
          }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvionixDesigner-${{ needs.version.outputs.version }}-windows-x64
          path: ${{ steps.package.outputs.installer }}

  build-macos:
    name: Build macOS installer
    runs-on: macos-13
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtsvg qtserialport
          cache: true

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package installer
        shell: pwsh
        run: cmake --build build --config Release --target package

      - name: Locate installer
        id: package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path build -Filter "AvionixDesigner-*-macos.dmg" -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "macOS installer was not produced by CPack"
          }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvionixDesigner-${{ needs.version.outputs.version }}-macos
          path: ${{ steps.package.outputs.installer }}

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - version
      - build-windows
      - build-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags

          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

          mapfile -t installers < <(find dist -type f \( -name "AvionixDesigner-*-windows-x64.exe" -o -name "AvionixDesigner-*-macos.dmg" \) | sort)
          if [[ "${#installers[@]}" -ne 2 ]]; then
            echo "Expected 2 installers, found ${#installers[@]}" >&2
            find dist -type f -print >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${installers[@]}" \
              --title "AvionixDesigner $RELEASE_VERSION" \
              --notes "Windows and macOS installers built from CMake project version $RELEASE_VERSION."
          fi
